name: Printer support, metric request or bug
description: New or untested printer, a missing feature or metric, a wrong value, or a connection problem. Attach a diagnostic report.
title: "[Printer/Metric]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the exporter. The **diagnostic report** shows exactly what your printer sends, so a new model, feature or metric can be added, or a wrong value fixed, without access to your printer.

        **Get the report:** open the exporter's **Diagnostics** page (`http://exporter-host:9109/diagnostics`, or the **Diagnostics** button on the status page) and click **Run diagnostics**. **Create GitHub issue** there opens this form with the title, a summary and the fields filled in. A small report is filled in too; a full one is copied and downloaded, so paste it (Ctrl+V) or drag the file into the box below. Access codes, tokens, serial numbers, IP addresses and names are removed; check the report before you post it.

        For the best report, run it **while the problem is visible** (for example during a print, while drying, or with the accessory fitted). Step-by-step guide: [Diagnostic Report](https://github.com/TheBlackBush/bambulab_metrics_exporter/wiki/Diagnostic-Report).
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - New or untested printer model
        - Missing feature or metric
        - Wrong or missing metric value
        - Connection or setup problem
        - Other bug
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Printer model
      options:
        - A1
        - A1 mini
        - A2L
        - P1P
        - P1S
        - P2S
        - X1
        - X1C
        - X1E
        - X2D
        - H2D
        - H2D Pro
        - H2S
        - H2C
        - H3C
        - R1
        - Other (write it in the description)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Printer firmware version
      description: Printer screen, or Bambu Studio / Handy firmware page. The report lists it too.
      placeholder: "01.08.00.00"
  - type: input
    id: version
    attributes:
      label: Exporter version
      description: Shown at the top of the status page, and in the report.
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Connection mode
      options:
        - LAN (local MQTT)
        - Bambu Cloud
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, or what is missing?
      description: For a wrong value, say what the exporter shows and what the printer screen shows. For a new metric, say which value you want and where you see it (printer screen, Bambu Studio or Handy).
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: Paste the copied report here, or drag the downloaded `.json` file into this box. If GitHub refuses the file, zip it first.
      placeholder: Paste the report, or drop bambulab-exporter-diagnostics-....json here
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Extra logs (optional)
      description: The report already holds the last 200 exporter log lines. Add more only if needed (`LOG_LEVEL=DEBUG`), with serials, IPs, emails and tokens removed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I opened the report and it contains nothing I do not want to share publicly.
          required: true
