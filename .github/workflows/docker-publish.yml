name: Docker Publish

on:
  release:
    types: [published]
  # Re-publish an existing release tag (for example to backfill Docker Hub).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.2.1)
        required: true
      latest:
        description: Also move the latest tag (only for the newest release)
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run full checks
        run: |
          mkdir -p tests/results
          python -m compileall -q src tests
          ruff check src tests
          mypy src
          pytest -q

      - name: Upload test result artifacts
        uses: actions/upload-artifact@v6
        with:
          name: test-results-release
          path: tests/results

  docker:
    needs: full-tests
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bambulab_metrics_exporter
      # Docker Hub is optional: only used when DOCKERHUB_USERNAME is set, as a repository
      # variable (readable logs) or a secret.
      DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: ${{ (vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME) && format('docker.io/{0}/bambulab_metrics_exporter', vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME) || '' }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || inputs.latest }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Update Docker Hub description from README
        if: env.DOCKERHUB_IMAGE != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USER }}/bambulab_metrics_exporter
          short-description: Prometheus exporter for Bambu Lab 3D printers (LAN or Bambu Cloud), with a Grafana dashboard
          readme-filepath: ./README.md
          enable-url-completion: true

      - name: Update release notes with image info
        uses: actions/github-script@v8
        env:
          WITH_LATEST: ${{ github.event_name == 'release' || inputs.latest }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const version = tag.replace(/^v/, '');
            const images = [process.env.IMAGE_NAME, process.env.DOCKERHUB_IMAGE]
              .filter(Boolean)
              .map((image) => image.replace(/^docker\.io\//, '').toLowerCase());
            const block = [
              '## Docker image',
              '',
              ...images.flatMap((image) => [
                `- ${image}:${version}`,
                ...(process.env.WITH_LATEST === 'true' ? [`- ${image}:latest`] : []),
              ]),
            ].join('\n');

            const current = release.body || '';
            const next = current.includes('## Docker image')
              ? current.replace(/## Docker image[\s\S]*/m, block)
              : `${current}\n\n${block}`.trim();

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: next,
            });
