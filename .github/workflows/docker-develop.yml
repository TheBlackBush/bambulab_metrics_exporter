name: Docker Develop

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only the newest develop commit needs an image; cancel superseded builds.
concurrency:
  group: docker-develop
  cancel-in-progress: true

jobs:
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run full checks
        run: |
          mkdir -p tests/results
          python -m compileall -q src tests
          ruff check src tests
          mypy src
          pytest -q

  docker:
    needs: full-tests
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bambulab_metrics_exporter
      # Docker Hub is optional: only used when DOCKERHUB_USERNAME is set, as a repository
      # variable (readable logs) or a secret.
      DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: ${{ (vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME) && format('docker.io/{0}/bambulab_metrics_exporter', vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Rolling `develop` tag plus an immutable `develop-<short sha>` tag. Never
      # touches `latest` or release version tags.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=develop
            type=sha,prefix=develop-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
