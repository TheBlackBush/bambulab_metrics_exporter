<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Printer Connection</title>
<noscript>{{REFRESH}}</noscript>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --text-secondary: #888;
    --green: #22c55e;
    --green-dim: rgba(34, 197, 94, 0.12);
    --yellow: #eab308;
    --yellow-dim: rgba(234, 179, 8, 0.12);
    --red: #ef4444;
    --red-dim: rgba(239, 68, 68, 0.12);
    --radius: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
    -webkit-font-smoothing: antialiased;
  }

  .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 1.25rem; }

  header { text-align: center; }
  header h1 { font-size: 1.25rem; font-weight: 600; }
  header p { color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.35rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
  }

  .status-row { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
  .label { color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .pill { font-size: 0.8rem; font-weight: 600; padding: 0.25rem 0.65rem; border-radius: 999px; }
  .pill.ok { color: var(--green); background: var(--green-dim); }
  .pill.wait { color: var(--yellow); background: var(--yellow-dim); }
  .pill.bad { color: var(--red); background: var(--red-dim); }
  .detail { color: var(--text-secondary); font-size: 0.82rem; margin-top: 0.6rem; overflow-wrap: anywhere; }

  /* Result of the last action: a quiet row inside the status card, not a separate banner. */
  .notice {
    display: flex; gap: 0.65rem; align-items: flex-start;
    margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid var(--border);
    font-size: 0.85rem; line-height: 1.4;
  }
  .notice-icon {
    flex: none; width: 1.2rem; height: 1.2rem; border-radius: 50%;
    display: grid; place-items: center; font-size: 0.72rem; font-weight: 700; margin-top: 0.05rem;
  }
  .notice.ok .notice-icon { color: var(--green); background: var(--green-dim); }
  .notice.bad .notice-icon { color: var(--red); background: var(--red-dim); }
  .notice-text { color: var(--text); overflow-wrap: anywhere; }
  .notice-note { display: block; color: var(--text-secondary); font-size: 0.78rem; margin-top: 0.15rem; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .tabs input { position: absolute; opacity: 0; pointer-events: none; }
  .tabs label {
    text-align: center; padding: 0.6rem; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); color: var(--text-secondary); font-size: 0.9rem;
  }
  #mode-local:checked + label, #mode-cloud:checked + label {
    color: var(--green); border-color: rgba(34, 197, 94, 0.5); background: var(--green-dim);
  }
  #mode-local:focus-visible + label, #mode-cloud:focus-visible + label { outline: 2px solid var(--green); }

  .panel { display: none; flex-direction: column; gap: 0.9rem; }
  body:has(#mode-local:checked) .panel-local,
  body:has(#mode-cloud:checked) .panel-cloud { display: flex; }

  form { display: flex; flex-direction: column; gap: 0.75rem; }
  .step { font-size: 0.8rem; color: var(--text-secondary); }
  label.field { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.82rem; color: var(--text-secondary); }
  input[type=text], input[type=email], input[type=password] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.6rem 0.7rem; font-size: 0.95rem; width: 100%;
  }
  input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .hint { font-size: 0.75rem; color: var(--text-secondary); }

  /* Buttons: primary = green action, tonal = helper action, danger = undo. None of them
     use the input styling, so no button can be mistaken for an empty or disabled field. */
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
    background: var(--green-dim); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.4);
    border-radius: 8px; padding: 0.6rem 0.95rem; font: inherit; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  button:hover { background: rgba(34, 197, 94, 0.22); border-color: rgba(34, 197, 94, 0.6); }
  button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button svg { width: 1rem; height: 1rem; flex: none; }

  button.tonal { background: #2c2c2c; color: var(--text); border-color: #3d3d3d; }
  button.tonal:hover { background: #363636; border-color: #4d4d4d; }

  button.danger { background: transparent; color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
  button.danger:hover { background: var(--red-dim); border-color: rgba(239, 68, 68, 0.65); }
  button.danger:focus-visible { outline-color: var(--red); }

  .field-label { font-size: 0.82rem; color: var(--text-secondary); }
  div.field { display: flex; flex-direction: column; gap: 0.3rem; }
  .input-row { display: flex; gap: 0.5rem; }
  .input-row input { flex: 1; min-width: 0; }
  .input-row button { flex: none; white-space: nowrap; }

  .row-form { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.9rem; }
  .row-form .step { flex: 1 1 220px; line-height: 1.45; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Result of a background action, filled in by the page script. */
  #page-notice.notice { margin: 0; padding: 0.9rem 1.25rem; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--surface); }

  /* Printer list and account picker. Their wrappers are always there, so a background
     refresh can fill them; empty ones must not add a gap to the page. */
  #printers-live:empty, #cloud-picker:empty { display: none; }
  .printer-row { display: flex; flex-direction: row; align-items: center; gap: 0.6rem; padding: 0.4rem 0; }
  .printer-row .step { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .printer-message { display: block; }
  .device-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1rem; }
  .device-row { display: flex; align-items: center; gap: 0.6rem; }
  .small { padding: 0.25rem 0.6rem; font-size: 0.8rem; }

  .links { display: flex; justify-content: space-between; font-size: 0.82rem; }
  .links a { color: var(--green); text-decoration: none; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Printer Connection</h1>
    <p>Bambu Lab Metrics Exporter v{{VERSION}}</p>
  </header>

  <div class="card" id="status-card" data-live{{DATA_REFRESH}}>
    <div class="status-row">
      <span class="label">Status</span>
      <span class="pill {{STATE_CLASS}}">{{STATE_LABEL}}</span>
    </div>
    <div class="detail">{{CURRENT}}</div>
    {{STATE_MESSAGE}}
    {{FLASH}}
  </div>
  <div id="printers-live" data-live>{{PRINTERS}}</div>
  <div id="page-notice" role="status" aria-live="polite"></div>

  <div class="card">
    <div class="tabs" role="radiogroup" aria-label="Connection mode">
      <input type="radio" name="mode" id="mode-local" {{LOCAL_CHECKED}}>
      <label for="mode-local">Local (LAN)</label>
      <input type="radio" name="mode" id="mode-cloud" {{CLOUD_CHECKED}}>
      <label for="mode-cloud">Bambu Cloud</label>
    </div>
  </div>

  <div class="card panel panel-local">
    <form method="post" action="{{LOCAL_ACTION}}">
      <label class="field">Printer IP address or host name
        <input type="text" name="host" required autocomplete="off" placeholder="192.168.1.50">
      </label>
      <label class="field">Serial number
        <input type="text" name="serial" required autocomplete="off" spellcheck="false">
      </label>
      <label class="field">LAN access code
        <input type="password" name="access_code" required autocomplete="off">
        <span class="hint">On the printer: Settings, Network (LAN Only Mode screen).</span>
      </label>
      <label class="field">Port (optional)
        <input type="text" name="port" inputmode="numeric" maxlength="5" autocomplete="off">
      </label>
      <label class="field">Name (optional)
        <input type="text" name="name" maxlength="64" autocomplete="off">
        <span class="hint">Needed with several printers: unnamed printers of one model share a label.</span>
      </label>
      <button type="submit">{{LOCAL_BUTTON}}</button>
    </form>
  </div>

  <div class="card panel panel-cloud">
    <form method="post" action="/auth/cloud/login">
      <!-- Enter key submits the first button in the form: make that "Log in", not "Send code". -->
      <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true">Log in</button>
      <div class="field">
        <label class="field-label" for="cloud-email">Bambu account email</label>
        <div class="input-row">
          <input id="cloud-email" type="email" name="email" required autocomplete="email" value="{{CLOUD_EMAIL}}">
          <button type="submit" class="tonal" id="send-code" formaction="/auth/cloud/send-code"{{SEND_ATTRS}}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>
            <span id="send-code-label">{{SEND_LABEL}}</span>
          </button>
        </div>
      </div>
      <label class="field">Verification code
        <input type="text" name="code" autocomplete="one-time-code" inputmode="numeric">
        <span class="hint">Check your inbox after clicking Send code.</span>
      </label>
      <button type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Log in
      </button>
    </form>
    <div id="cloud-picker" data-live>{{CLOUD_PICKER}}</div>
  </div>

  <div class="card">
    <form method="post" action="/auth/reset" class="row-form">
      <span class="step">Settings saved on this page override env vars. Reset to go back to the container's env vars.</span>
      <button type="submit" class="danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Reset to env vars
      </button>
    </form>
  </div>

  <div class="links">
    <a href="/">Back to status</a>
    <a href="/metrics">View metrics</a>
  </div>

</div>
<script>
(function () {
  var button = document.getElementById("send-code");
  var label = document.getElementById("send-code-label");
  var notice = document.getElementById("page-notice");
  var countdown = null;
  var pollTimer = null;
  var refreshSeq = 0;

  // A deadline, not a counter, so a throttled background tab stays correct.
  function startCountdown(seconds) {
    if (!button || !label) { return; }
    var deadline = Date.now() + seconds * 1000;
    button.setAttribute("disabled", "");
    button.setAttribute("data-wait", String(seconds));
    function tick() {
      var left = Math.ceil((deadline - Date.now()) / 1000);
      if (!(left > 0)) {
        button.removeAttribute("disabled");
        button.removeAttribute("data-wait");
        label.textContent = "Send code";
        return;
      }
      label.textContent = "Send code (" +
        (left <= 60 ? left + "s" : Math.floor(left / 60) + "m " + (left % 60) + "s") + ")";
      countdown = setTimeout(tick, 1000);
    }
    if (countdown) { clearTimeout(countdown); }
    tick();
  }

  // Back to an active button, e.g. after the server reset the send-code limit.
  function resetSendButton() {
    if (countdown) { clearTimeout(countdown); countdown = null; }
    if (!button || !label) { return; }
    button.removeAttribute("disabled");
    button.removeAttribute("data-wait");
    label.textContent = "Send code";
  }

  // Message text only, never markup.
  function showNotice(ok, text, note) {
    if (!notice) { return; }
    while (notice.firstChild) { notice.removeChild(notice.firstChild); }
    notice.className = "notice " + (ok ? "ok" : "bad");
    var icon = document.createElement("span");
    icon.className = "notice-icon";
    icon.setAttribute("aria-hidden", "true");
    icon.textContent = ok ? "✓" : "!";
    var body = document.createElement("span");
    body.className = "notice-text";
    body.textContent = text;
    if (note) {
      var extra = document.createElement("span");
      extra.className = "notice-note";
      extra.textContent = note;
      body.appendChild(extra);
    }
    notice.appendChild(icon);
    notice.appendChild(body);
  }

  // Replace the [data-live] parts with the server's current version. Inputs outside them,
  // the Send code button and the open tab are never touched, and neither is a part marked
  // data-dirty (the picker while it has unsaved ticks).
  function refreshLive() {
    var seq = ++refreshSeq;
    return fetch("/auth", {headers: {"Accept": "text/html"}, credentials: "same-origin"})
      .then(function (response) {
        if (!response.ok) { throw new Error("status"); }
        return response.text();
      })
      .then(function (text) {
        if (seq !== refreshSeq) { return; }  // a newer request is in flight or done
        var doc = new DOMParser().parseFromString(text, "text/html");
        if (doc.querySelector("#send-code[data-wait]")) { return; }
        var live = document.querySelectorAll("[data-live]");
        for (var i = 0; i < live.length; i++) {
          var current = live[i];
          var fresh = current.id ? doc.getElementById(current.id) : null;
          if (fresh && current.parentNode && !current.hasAttribute("data-dirty")) {
            current.parentNode.replaceChild(fresh, current);
          }
        }
      })
      .catch(function () {})
      .then(schedulePoll);
  }

  // While the status card says the exporter is still connecting, poll it. One timer only,
  // and it stops by itself once the card no longer carries data-refresh.
  function schedulePoll() {
    if (pollTimer) { return; }
    var card = document.getElementById("status-card");
    if (!card || !card.hasAttribute("data-refresh")) { return; }
    pollTimer = setTimeout(function () {
      pollTimer = null;
      refreshLive();
    }, 3000);
  }

  function clearSecrets(form) {
    var fields = form.querySelectorAll('input[type="password"], input[name="code"]');
    for (var i = 0; i < fields.length; i++) { fields[i].value = ""; }
  }

  // Lets the next refresh replace the picker again.
  function clearPickerEdits() {
    var picker = document.getElementById("cloud-picker");
    if (picker) { picker.removeAttribute("data-dirty"); }
  }

  function formBody(form, submitter) {
    try {
      return new URLSearchParams(new FormData(form, submitter));
    } catch (error) {
      return new URLSearchParams(new FormData(form));
    }
  }

  // On the document, because refreshes replace the picker node.
  document.addEventListener("change", function (event) {
    var picker = document.getElementById("cloud-picker");
    if (picker && picker.contains(event.target)) { picker.setAttribute("data-dirty", ""); }
  });

  // Every post form is sent in the background; without JavaScript the forms still post and
  // the server redirects back here.
  document.addEventListener("submit", function (event) {
    var form = event.target;
    if (!form || !form.matches || !form.matches('form[method="post"]')) { return; }
    event.preventDefault();
    if (form.busy) { return; }  // the form is already being sent
    var submitter = event.submitter || null;
    var isSend = !!submitter && submitter.id === "send-code";
    var email = form.querySelector('input[name="email"]');
    if (isSend && email) {
      if (!email.checkValidity()) { email.reportValidity(); return; }
    } else if (!form.reportValidity()) {
      return;
    }
    // The formaction attribute only: the formAction property falls back to the page URL.
    var url = (submitter && submitter.getAttribute("formaction")) || form.action;
    form.busy = true;
    if (submitter) { submitter.setAttribute("disabled", ""); }
    function release() {
      if (submitter) { submitter.removeAttribute("disabled"); }
    }
    fetch(url, {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Accept": "application/json",
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: formBody(form, submitter)
    }).then(function (response) {
      if (!response.ok) { throw new Error("status"); }
      return response.json();
    }).then(function (data) {
      showNotice(!!data.ok, String(data.message), data.note ? String(data.note) : "");
      if (data.ok && !isSend) { clearSecrets(form); }
      if (data.ok && url.indexOf("/auth/printers/add-local") !== -1) { form.reset(); }
      // After these the server's list is the truth: a kept picker could belong to another login.
      if (data.ok && /\/auth\/(printers\/select|cloud\/login|reset)/.test(url)) {
        clearPickerEdits();
      }
      var wait = Number(data.wait_seconds);
      if (isSend && wait > 0) { startCountdown(wait); } else { release(); }
      // A successful login reset the send-code limit on the server.
      if (data.ok && url.indexOf("/auth/cloud/login") !== -1) { resetSendButton(); }
      return refreshLive();
    }).catch(function () {
      showNotice(false, "Could not complete that. Try again.");
      release();
    }).then(function () {
      form.busy = false;
    });
  });

  if (button && button.hasAttribute("data-wait")) {
    startCountdown(parseInt(button.getAttribute("data-wait"), 10));
  }
  schedulePoll();
})();
</script>
</body>
</html>
