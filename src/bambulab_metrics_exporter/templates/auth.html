<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Printer Connection</title>
{{REFRESH}}
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --text-secondary: #888;
    --green: #22c55e;
    --green-dim: rgba(34, 197, 94, 0.12);
    --yellow: #eab308;
    --yellow-dim: rgba(234, 179, 8, 0.12);
    --red: #ef4444;
    --red-dim: rgba(239, 68, 68, 0.12);
    --radius: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
    -webkit-font-smoothing: antialiased;
  }

  .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 1.25rem; }

  header { text-align: center; }
  header h1 { font-size: 1.25rem; font-weight: 600; }
  header p { color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.35rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
  }

  .status-row { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
  .label { color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .pill { font-size: 0.8rem; font-weight: 600; padding: 0.25rem 0.65rem; border-radius: 999px; }
  .pill.ok { color: var(--green); background: var(--green-dim); }
  .pill.wait { color: var(--yellow); background: var(--yellow-dim); }
  .pill.bad { color: var(--red); background: var(--red-dim); }
  .detail { color: var(--text-secondary); font-size: 0.82rem; margin-top: 0.6rem; overflow-wrap: anywhere; }

  /* Result of the last action: a quiet row inside the status card, not a separate banner. */
  .notice {
    display: flex; gap: 0.65rem; align-items: flex-start;
    margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid var(--border);
    font-size: 0.85rem; line-height: 1.4;
  }
  .notice-icon {
    flex: none; width: 1.2rem; height: 1.2rem; border-radius: 50%;
    display: grid; place-items: center; font-size: 0.72rem; font-weight: 700; margin-top: 0.05rem;
  }
  .notice.ok .notice-icon { color: var(--green); background: var(--green-dim); }
  .notice.bad .notice-icon { color: var(--red); background: var(--red-dim); }
  .notice-text { color: var(--text); overflow-wrap: anywhere; }
  .notice-note { display: block; color: var(--text-secondary); font-size: 0.78rem; margin-top: 0.15rem; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .tabs input { position: absolute; opacity: 0; pointer-events: none; }
  .tabs label {
    text-align: center; padding: 0.6rem; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); color: var(--text-secondary); font-size: 0.9rem;
  }
  #mode-local:checked + label, #mode-cloud:checked + label {
    color: var(--green); border-color: rgba(34, 197, 94, 0.5); background: var(--green-dim);
  }
  #mode-local:focus-visible + label, #mode-cloud:focus-visible + label { outline: 2px solid var(--green); }

  .panel { display: none; flex-direction: column; gap: 0.9rem; }
  body:has(#mode-local:checked) .panel-local,
  body:has(#mode-cloud:checked) .panel-cloud { display: flex; }

  form { display: flex; flex-direction: column; gap: 0.75rem; }
  .step { font-size: 0.8rem; color: var(--text-secondary); }
  label.field { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.82rem; color: var(--text-secondary); }
  input[type=text], input[type=email], input[type=password] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.6rem 0.7rem; font-size: 0.95rem; width: 100%;
  }
  input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .hint { font-size: 0.75rem; color: var(--text-secondary); }

  /* Buttons: primary = green action, tonal = helper action, danger = undo. None of them
     use the input styling, so no button can be mistaken for an empty or disabled field. */
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
    background: var(--green-dim); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.4);
    border-radius: 8px; padding: 0.6rem 0.95rem; font: inherit; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  button:hover { background: rgba(34, 197, 94, 0.22); border-color: rgba(34, 197, 94, 0.6); }
  button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  button svg { width: 1rem; height: 1rem; flex: none; }

  button.tonal { background: #2c2c2c; color: var(--text); border-color: #3d3d3d; }
  button.tonal:hover { background: #363636; border-color: #4d4d4d; }

  button.danger { background: transparent; color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
  button.danger:hover { background: var(--red-dim); border-color: rgba(239, 68, 68, 0.65); }
  button.danger:focus-visible { outline-color: var(--red); }

  .field-label { font-size: 0.82rem; color: var(--text-secondary); }
  div.field { display: flex; flex-direction: column; gap: 0.3rem; }
  .input-row { display: flex; gap: 0.5rem; }
  .input-row input { flex: 1; min-width: 0; }
  .input-row button { flex: none; white-space: nowrap; }

  .row-form { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.9rem; }
  .row-form .step { flex: 1 1 220px; line-height: 1.45; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .links { display: flex; justify-content: space-between; font-size: 0.82rem; }
  .links a { color: var(--green); text-decoration: none; }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Printer Connection</h1>
    <p>Bambu Lab Metrics Exporter v{{VERSION}}</p>
  </header>

  <div class="card">
    <div class="status-row">
      <span class="label">Status</span>
      <span class="pill {{STATE_CLASS}}">{{STATE_LABEL}}</span>
    </div>
    <div class="detail">{{CURRENT}}</div>
    {{STATE_MESSAGE}}
    {{FLASH}}
  </div>

  <div class="card">
    <div class="tabs" role="radiogroup" aria-label="Connection mode">
      <input type="radio" name="mode" id="mode-local" {{LOCAL_CHECKED}}>
      <label for="mode-local">Local (LAN)</label>
      <input type="radio" name="mode" id="mode-cloud" {{CLOUD_CHECKED}}>
      <label for="mode-cloud">Bambu Cloud</label>
    </div>
  </div>

  <div class="card panel panel-local">
    <form method="post" action="/auth/local">
      <label class="field">Printer IP address or host name
        <input type="text" name="host" required autocomplete="off" placeholder="192.168.1.50">
      </label>
      <label class="field">Serial number
        <input type="text" name="serial" required autocomplete="off" spellcheck="false">
      </label>
      <label class="field">LAN access code
        <input type="password" name="access_code" required autocomplete="off">
        <span class="hint">On the printer: Settings, Network (LAN Only Mode screen).</span>
      </label>
      <button type="submit">Connect locally</button>
    </form>
  </div>

  <div class="card panel panel-cloud">
    <form method="post" action="/auth/cloud/login">
      <!-- Enter key submits the first button in the form: make that "Log in", not "Send code". -->
      <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true">Log in</button>
      <div class="field">
        <label class="field-label" for="cloud-email">Bambu account email</label>
        <div class="input-row">
          <input id="cloud-email" type="email" name="email" required autocomplete="email" value="{{CLOUD_EMAIL}}">
          <button type="submit" class="tonal" formaction="/auth/cloud/send-code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>
            Send code
          </button>
        </div>
      </div>
      <label class="field">Verification code
        <input type="text" name="code" autocomplete="one-time-code" inputmode="numeric">
        <span class="hint">Check your inbox after clicking Send code.</span>
      </label>
      <label class="field">Serial number (optional)
        <input type="text" name="serial" autocomplete="off" spellcheck="false">
        <span class="hint">Leave empty when the account has a single printer.</span>
      </label>
      <button type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Log in
      </button>
    </form>
  </div>

  <div class="card">
    <form method="post" action="/auth/reset" class="row-form">
      <span class="step">Settings saved on this page override env vars. Reset to go back to the container's env vars.</span>
      <button type="submit" class="danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Reset to env vars
      </button>
    </form>
  </div>

  <div class="links">
    <a href="/">Back to status</a>
    <a href="/metrics">View metrics</a>
  </div>

</div>
</body>
</html>
